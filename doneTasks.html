 if(e.key==='Escape'){if(!pop.hidden)close();else if(sel){sel=null;sh();dirty=1}return}
 if(/TEXTAREA|INPUT/.test(e.target.tagName))return;const k=e.key,m=e.ctrlKey||e.metaKey;

 else if(!sel)return;else if(m&&k==='d'){e.preventDefault();A.dup()}

 else if(k.startsWith('Arrow')){e.preventDefault();const s=e.shiftKey?20:4;sel.x+=k==='ArrowLeft'?-s:k==='ArrowRight'?s:0;sel.y+=k==='ArrowUp'?-s:k==='ArrowDown'?s:0;dirty=1;clearTimeout(window._at);window._at=setTimeout(push,300)}});

const VER=(($('meta[name=app-version]')||{}).content)||'0',HK='ienjazati-hash',RK='ienjazati-rl';
const hs=x=>{let h=5381;for(let i=0;i<x.length;i++)h=(h*33^x.charCodeAt(i))>>>0;return x.length.toString(36)+h.toString(36)};
let pd=0,upd=0,lc=0;
addEventListener('pointerdown',()=>pd=1,true);addEventListener('pointerup',()=>pd=0,true);addEventListener('pointercancel',()=>pd=0,true);
const idle=()=>!pd&&!exporting&&document.activeElement!==ti&&document.activeElement!==$('#ta');
function go(nh){flush();lss(HK,nh);try{sessionStorage.setItem(RK,nh)}catch(e){}toast('جارٍ تحديث التطبيق إلى أحدث نسخة…');setTimeout(()=>{flush();location.replace(location.pathname+'?v='+nh+location.hash)},600)}
function wait(nh){let n=0;const t=()=>{if(idle())go(nh);else if(++n<=30)setTimeout(t,1000);else upd=0};t()}
async function chk(man){
 if(!/^https?:$/.test(location.protocol)||upd||(!man&&Date.now()-lc<3000))return;lc=Date.now();upd=1;
 try{const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store',credentials:'omit'});if(!r.ok)throw 0;
  const t=await r.text(),m=t.match(/<meta name="app-version" content="([^"]*)"/),nh=hs(t),ph=lsg(HK);
  if((m&&m[1]!==VER)||(ph&&ph!==nh)){let done=0;try{done=sessionStorage.getItem(RK)===nh}catch(e){}if(man||!done){wait(nh);return}}
  if(!ph)lss(HK,nh);upd=0;if(man)toast('أنت على أحدث نسخة ✓')}
 catch(e){upd=0;if(man)toast('تعذّر التحقق الآن، حاول لاحقًا')}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
addEventListener('pageshow',e=>{if(e.persisted)chk()});

init();
requestAnimationFrame(()=>setTimeout(()=>chk(),400));
})();
